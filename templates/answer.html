<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grammar Result</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: auto;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .eyebrow {
            color: #6366f1;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4f46e5;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #555;
            font-size: 16px;
        }

        .section {
            margin-bottom: 25px;
        }

        .title {
            font-size: 17px;
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
        }

        .original {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            color: #333;
        }

        .corrected {
            background: #ecfdf5;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 20px;
            font-size: 21px;
            font-weight: bold;
            color: #065f46;
        }

        .actions {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr;
            margin-top: 18px;
        }

        .action {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            color: #3730a3;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            padding: 12px;
        }

        .action:hover {
            background: #e0e7ff;
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .button:hover {
            background: #3730a3;
        }

        @media (max-width: 600px) {
            .container {
                padding: 26px 20px;
                width: calc(100% - 28px);
            }

            .header h1 {
                font-size: 27px;
            }
        }

    </style>

</head>

<body>

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="{{ url_for('static', filename='istock.mp4') }}"
            type="video/mp4"
        >

    </video>

    <div class="overlay"></div>


    <div class="container">

        <div class="header">

            <div class="eyebrow">Your improved sentence</div>

            <h1>🤖 Grammar Result</h1>

            <p>AI has checked your sentence</p>

        </div>


        <div class="section">

            <div class="title">
                Your Sentence
            </div>

            <div class="original">
                {{ original }}
            </div>

        </div>

        <div class="actions">
            <button class="action" id="copy-button" type="button">Copy correction</button>
            <button class="action" id="speak-button" type="button">Read aloud</button>
        </div>


        <div class="section">

            <div class="title">
                Corrected Sentence
            </div>

            <div class="corrected">
                {{ corrected }}
            </div>

            <div id="corrected-data" data-text="{{ corrected }}" hidden></div>

        </div>


        <a href="/" class="button">
            🔄 Check Another Sentence
        </a>

    </div>

    <script>
        const correctedText = document.querySelector("#corrected-data").dataset.text;
        const copyButton = document.querySelector("#copy-button");
        const speakButton = document.querySelector("#speak-button");

        copyButton.addEventListener("click", async () => {
            await navigator.clipboard.writeText(correctedText);
            copyButton.textContent = "Copied";
            setTimeout(() => copyButton.textContent = "Copy correction", 1600);
        });

        speakButton.addEventListener("click", () => {
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(correctedText));
        });
    </script>

</body>

</html>
